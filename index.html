<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid Live Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          <h1>Mermaid<span class="highlight">Flow</span></h1>
        </div>
        <div class="header-controls">
          <button id="exampleBtn" class="btn btn-secondary">Load Example</button>
          <button id="downloadBtn" class="btn btn-primary">Download SVG</button>
        </div>
      </header>
      
      <main class="main-content">
        <section class="editor-pane glass-panel">
          <div class="pane-header">
            <h2>Code Editor</h2>
            <span class="status-indicator" id="status">Ready</span>
          </div>
          <textarea id="input" spellcheck="false" placeholder="Enter Mermaid code here...">graph TD
  A[Start] --> B{Is it working?}
  B -- Yes --> C[Great!]
  B -- No --> D[Debug It]</textarea>
        </section>
        
        <section class="preview-pane glass-panel">
          <div class="pane-header">
             <h2>Live Preview</h2>
             <div class="zoom-controls">
               <button id="zoomIn" title="Zoom In">+</button>
               <button id="zoomReset" title="Reset">1:1</button>
               <button id="zoomOut" title="Zoom Out">-</button>
               <button id="fullViewBtn" title="Full View">⛶</button>
             </div>
          </div>
          <div id="output" class="mermaid-container"></div>
          <div id="error" class="error-container hidden"></div>
        </section>
      </main>
      
      <footer class="app-footer">
        <p>Built with <a href="https://mermaid.js.org" target="_blank">Mermaid.js</a> & Vite</p>
      </footer>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
